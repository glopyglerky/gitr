name: gitr SurrealDB qualification
on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr-surreal-probe/**'
      - 'ci/gitr-surreal-smoke.py'
      - '.github/workflows/gitr-surreal-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitr-surreal-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'glopyglerky/gitr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - name: Bootstrap pinned Lustr
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          echo "$GITHUB_WORKSPACE/.gitr-ci/lustr/bin" >> "$GITHUB_PATH"
      - name: Build and qualify actual SurrealDB 4.0.0 with SurrealKV
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr-surreal-probe/Cargo.toml -- --check
          lustr --engine rustc build --manifest-path rust/gitr-surreal-probe/Cargo.toml --locked
          lustr --engine rustc clippy --manifest-path rust/gitr-surreal-probe/Cargo.toml --locked -- -D warnings
          python3 ci/gitr-surreal-smoke.py
          lustr --engine rustc tree --manifest-path rust/gitr-surreal-probe/Cargo.toml --locked -i surrealkv
# No GH_TOKEN, new lockfile generation, or in-workflow writes to the repository.
