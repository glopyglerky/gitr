name: Resolve imported Rust dependency locks
on:
  push:
    branches: [gitr/rust-upstream-import]
    paths:
      - Cargo.toml
      - vendor/grit/**/Cargo.toml
      - ci/refresh_locks.rs
      - .github/workflows/gitr-native-locks.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gitr-import-locks
  cancel-in-progress: false
jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gitr/rust-upstream-import
      - name: Select the orchestration compiler and Cargo resolver
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compile dependency-free lock coordinator
        run: rustup run 1.99.1 rustc --edition=2024 ci/refresh_locks.rs -o "${{ runner.temp }}/gitr-refresh-locks"
      - name: Resolve and publish locks without compiling application code
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: '"${{ runner.temp }}/gitr-refresh-locks"'
