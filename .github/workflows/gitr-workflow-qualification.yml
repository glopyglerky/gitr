name: gitr Rbit workflows
on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr/**'
      - 'rust/vendor/rbit-workflow/**'
      - 'rust/gitr-action-example/**'
      - 'ci/gitr-workflow-smoke.py'
      - 'ci/gitr-redb-policy.py'
      - '.github/workflows/gitr-workflow-qualification.yml'
  pull_request:
    paths:
      - 'rust/gitr/**'
      - 'rust/vendor/rbit-workflow/**'
      - 'rust/gitr-action-example/**'
      - 'ci/gitr-workflow-smoke.py'
      - 'ci/gitr-redb-policy.py'
      - '.github/workflows/gitr-workflow-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitr-workflows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - name: Retain actual pre-workflow implementation for downgrade refusal tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/gitr
          ref: a02dca8462a5a30fd15a102e12f8a5e7d03d152b
          path: .gitr-ci/previous-gitr
          persist-credentials: false
      - name: Bootstrap pinned Lustr
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          printf '%s/.gitr-ci/lustr/bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Build old worker without changing current source
        run: |
          lustr --engine rustc build --manifest-path .gitr-ci/previous-gitr/rust/gitr/Cargo.toml --locked
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          cp ".gitr-ci/previous-gitr/rust/gitr/target/debug/gitr$suffix" ".gitr-ci/gitr-before$suffix"
      - name: Test complete vendored Rbit source and documentation examples
        run: |
          lustr --engine rustc test --manifest-path rust/vendor/rbit-workflow/Cargo.toml --locked --all-targets
          lustr --engine rustc test --manifest-path rust/vendor/rbit-workflow/Cargo.toml --locked --doc
      - name: Test integrated workflow, claim gates and exports
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr/Cargo.toml --package gitr -- --check
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --features workflows,action-api --all-targets
      - name: Strict Gitr diagnostics
        if: runner.os == 'Linux'
        run: lustr --engine rustc clippy --manifest-path rust/gitr/Cargo.toml --locked --features workflows,action-api --all-targets -- -D warnings
      - name: Actual Rust Wasm, immutable YAML, CLI and HTTP dependencies
        run: |
          lustr --engine rustc build --manifest-path rust/gitr/Cargo.toml --locked --features workflows,action-api
          lustr --engine rustc build --manifest-path rust/gitr-action-example/Cargo.toml --locked --release --target wasm32-unknown-unknown
          python ci/gitr-workflow-smoke.py
      - name: Default-build safety and redb policy
        run: |
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --no-default-features --all-targets
          python ci/gitr-redb-policy.py --self-test
          python ci/gitr-redb-policy.py
      - name: Qualification must not rewrite committed source or lockfiles
        run: git diff --exit-code -- rust/gitr rust/vendor/rbit-workflow rust/gitr-action-example
