name: Gitr produced BlueFe qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: [self-hosted, linux, gitr-bluefe]
    env:
      BLUEFE_ROOT: ${{ vars.GITR_BLUEFE_ROOT }}
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/.gitr-ci/gitr-qualification-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust qualification coordinator (provisioned reviewed bundle)
        run: '"${{ vars.GITR_BLUEFE_ROOT }}/bin/lustr" --bluefe-root "${{ vars.GITR_BLUEFE_ROOT }}" run --manifest-path xtask/Cargo.toml --locked -- qualify'
# No compiler installation or hosted/macOS/Windows qualification is implied.
