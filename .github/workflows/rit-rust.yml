name: Rit produced BlueFe qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    # Existing self-hosted runners retain their provisioned label.
    runs-on: [self-hosted, linux, gitr-bluefe]
    env:
      BLUEFE_ROOT: ${{ vars.RIT_BLUEFE_ROOT || vars.GITR_BLUEFE_ROOT }}
      # Manual qualification requires a provisioned Git 2.55.0 oracle too.
      # The hosted native workflow builds its own pinned external oracle.
      RIT_REFERENCE_GIT: ${{ vars.RIT_REFERENCE_GIT || vars.GITR_REFERENCE_GIT }}
      SLEY_TEST_GIT: ${{ vars.RIT_REFERENCE_GIT || vars.GITR_REFERENCE_GIT }}
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/.rit-ci/rit-qualification-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust qualification coordinator (provisioned reviewed bundle)
        run: '"${{ vars.RIT_BLUEFE_ROOT || vars.GITR_BLUEFE_ROOT }}/bin/lustr" --bluefe-root "${{ vars.RIT_BLUEFE_ROOT || vars.GITR_BLUEFE_ROOT }}" run --manifest-path xtask/Cargo.toml --locked -- qualify'
# No compiler installation or hosted/macOS/Windows qualification is implied.
