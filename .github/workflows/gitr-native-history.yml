name: gitr native history candidate
on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr/src/git_write.rs'
      - 'ci/candidates/native_history.rs'
      - 'ci/gitr-native-history-prepare.py'
      - '.github/workflows/gitr-native-history.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gitr-native-history-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'glopyglerky/gitr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - name: Bootstrap pinned Lustr and reviewed integration
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          echo "$GITHUB_WORKSPACE/.gitr-ci/lustr/bin" >> "$GITHUB_PATH"
          python3 ci/gitr-native-history-prepare.py
      - name: Native authoring, Git reference comparisons and redb Wasm integration
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr/Cargo.toml
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --all-targets
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --features action-api --all-targets
          lustr --engine rustc clippy --manifest-path rust/gitr/Cargo.toml --locked --all-targets --features action-api -- -D warnings
          python3 ci/gitr-redb-policy.py --self-test
          python3 ci/gitr-redb-policy.py
          git diff --exit-code -- rust/gitr/Cargo.toml rust/gitr/Cargo.lock
      - name: Preserve exact tested source blobs for explicit activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          print('TESTED_BASE_COMMIT=' + os.environ['GITHUB_SHA'])
          for path in ['rust/gitr/src/git.rs','rust/gitr/src/git_write.rs','rust/gitr/tests/native_history.rs']:
              data = Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/glopyglerky/gitr/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              print('TESTED_BLOB=' + json.dumps({'path':path,'sha':blob['sha'],'sha256':hashlib.sha256(data).hexdigest()}))
          PY
# Trusted master only. Final step stores immutable blobs, never commits or refs.
# Remove preparation and write permission after explicit tested-source activation.
