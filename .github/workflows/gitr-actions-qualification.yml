name: gitr action candidate

on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr/src/actions*.rs'
      - 'rust/gitr-action-example/**'
      - 'ci/gitr-actions-*.py'
      - '.github/workflows/gitr-actions-qualification.yml'
  workflow_dispatch:

# Only trusted master pushes run this bootstrap. The token is exposed solely to
# the final step, which creates immutable blobs for review, NEVER a commit/ref.
permissions:
  contents: write

concurrency:
  group: gitr-action-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'glopyglerky/gitr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - name: Prepare reviewed compiler and integration
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          echo RUSTUP_TOOLCHAIN=1.99.1 >> "$GITHUB_ENV"
          cargo +1.99.1 install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          echo "$GITHUB_WORKSPACE/.gitr-ci/lustr/bin" >> "$GITHUB_PATH"
          python3 ci/gitr-actions-prepare.py
      - name: Format and test candidate through Lustr
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr/Cargo.toml
          lustr --engine rustc fmt --manifest-path rust/gitr-action-example/Cargo.toml
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --all-targets
          lustr --engine rustc clippy --manifest-path rust/gitr/Cargo.toml --locked --all-targets -- -D warnings
          lustr --engine rustc build --manifest-path rust/gitr-action-example/Cargo.toml --locked --release --target wasm32-unknown-unknown
          python3 ci/gitr-actions-smoke.py
      - name: Retain exact tested blobs for explicit review and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          paths = ['rust/gitr/Cargo.toml', 'rust/gitr/Cargo.lock', 'rust/gitr/src/lib.rs', 'rust/gitr/src/main.rs', 'rust/gitr/src/actions.rs', 'rust/gitr/src/actions_tests.rs', 'rust/gitr-action-example/src/lib.rs']
          print('TESTED_BASE_COMMIT=' + os.environ['GITHUB_SHA'])
          for path in paths:
              data = Path(path).read_bytes()
              body = json.dumps({'encoding':'base64', 'content':base64.b64encode(data).decode()}).encode()
              req = urllib.request.Request('https://api.github.com/repos/glopyglerky/gitr/git/blobs', data=body, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  blob = json.load(response)
              print('TESTED_BLOB=' + json.dumps({'path':path, 'sha':blob['sha'], 'sha256':hashlib.sha256(data).hexdigest()}))
          PY
