name: gitr redb forge candidate
on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr/src/actions_forge*.rs'
      - 'ci/gitr-forge-*.py'
      - '.github/workflows/gitr-forge-qualification.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gitr-forge-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'glopyglerky/gitr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitRbit/rbit
          ref: 39f932a00b7aa35b324e06a9ff2343a57d4bed76
          path: .gitr-ci/rbit-src
          persist-credentials: false
      - name: Bootstrap pinned Lustr and preserve pre-import dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          echo "$GITHUB_WORKSPACE/.gitr-ci/lustr/bin" >> "$GITHUB_PATH"
          cp rust/gitr/Cargo.lock .gitr-ci/before-forge-lock.toml
          python3 -m py_compile ci/gitr-forge-prepare.py ci/gitr-forge-smoke.py
          python3 ci/gitr-forge-prepare.py
      - name: Test the complete upstream domain crate without source changes
        run: |
          lustr --engine rustc test --manifest-path rust/vendor/rbit-core/Cargo.toml --all-targets
          lustr --engine rustc test --manifest-path rust/vendor/rbit-core/Cargo.toml --locked --doc
      - name: Qualify Gitr forge transactions and shared API
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr/Cargo.toml --package gitr
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --all-features --all-targets
          lustr --engine rustc clippy --manifest-path rust/gitr/Cargo.toml --locked --all-features --all-targets -- -D warnings
          lustr --engine rustc build --manifest-path rust/gitr/Cargo.toml --locked --all-features
          lustr --engine rustc build --manifest-path rust/gitr-action-example/Cargo.toml --locked --release --target wasm32-unknown-unknown
          python3 ci/gitr-forge-smoke.py
          python3 ci/gitr-api-smoke.py
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --no-default-features --all-targets
          python3 ci/gitr-redb-policy.py --self-test
          python3 ci/gitr-redb-policy.py
      - name: Verify import provenance and record dependency license evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,tomllib
          from pathlib import Path
          root=Path('rust/vendor/rbit-core')
          record=json.loads((root/'UPSTREAM.json').read_text())
          for original in record['original_files']:
              path=root/('UPSTREAM-Cargo.toml' if original['path']=='Cargo.toml' else original['path'])
              assert hashlib.sha256(path.read_bytes()).hexdigest()==original['sha256'],str(path)
          old=tomllib.loads(Path('.gitr-ci/before-forge-lock.toml').read_text())['package']
          previous={(p['name'],p['version']) for p in old}
          new=tomllib.loads(Path('rust/gitr/Cargo.lock').read_text())['package']
          for name,version in [('gix','0.90.0'),('redb','4.5.0'),('wasmi','2.0.0')]:
              assert [p['version'] for p in new if p['name']==name]==[version]
          metadata=json.loads(subprocess.check_output(['cargo','metadata','--format-version','1','--locked','--all-features','--manifest-path','rust/gitr/Cargo.toml']))
          packages=[]
          for package in metadata['packages']:
              if (package['name'],package['version']) in previous:continue
              notices=[]
              for path in sorted(Path(package['manifest_path']).parent.iterdir()):
                  if path.is_file() and path.name.upper().startswith(('LICENSE','COPYING','NOTICE')):
                      notices.append({'name':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
              packages.append({'package':package['name'],'version':package['version'],'license':package['license'],'source':package['source'],'notices':notices})
          Path('Documentation/gitr/rbit-core-dependencies.json').write_text(json.dumps({'schema_version':1,'scope':'new resolved packages and notice hashes, not full release legal certification','packages':packages},indent=2)+'\n')
          print('UPSTREAM_ORIGINAL_FILES_VERIFIED='+str(len(record['original_files'])))
          print('NEW_DEPENDENCIES='+json.dumps(packages))
          PY
      - name: Retain exact tested implementation and donor tree without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          def post(endpoint,payload):
              req=urllib.request.Request('https://api.github.com/repos/glopyglerky/gitr/git/'+endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          root=Path('rust/vendor/rbit-core');entries=[]
          for path in sorted(root.rglob('*')):
              rel=path.relative_to(root)
              if 'target' in rel.parts or not path.is_file():continue
              assert not path.is_symlink()
              blob=post('blobs',{'encoding':'base64','content':base64.b64encode(path.read_bytes()).decode()})
              entries.append({'path':rel.as_posix(),'mode':'100755' if path.stat().st_mode & 0o111 else '100644','type':'blob','sha':blob['sha']})
          tree=post('trees',{'tree':entries})
          print('TESTED_BASE_COMMIT='+os.environ['GITHUB_SHA'])
          print('TESTED_VENDOR_TREE='+json.dumps({'path':str(root),'sha':tree['sha'],'files':len(entries)}))
          paths=['rust/gitr/Cargo.toml','rust/gitr/Cargo.lock','rust/gitr/src/lib.rs','rust/gitr/src/main.rs','rust/gitr/src/actions.rs','rust/gitr/src/actions_api.rs','rust/gitr/src/actions_forge.rs','rust/gitr/src/actions_forge_tests.rs','Documentation/gitr/rbit-core-dependencies.json']
          for name in paths:
              data=Path(name).read_bytes();blob=post('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              print('TESTED_BLOB='+json.dumps({'path':name,'sha':blob['sha'],'sha256':hashlib.sha256(data).hexdigest()}))
          PY
# Trusted staging only: source preparation and contents:write are removed on
# activation. The final step writes immutable blobs/trees only, never refs.
