name: gitr redb action API
on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr/**'
      - 'rust/gitr-action-example/**'
      - 'ci/gitr-api-smoke.py'
      - 'ci/gitr-redb-policy.py'
      - '.github/workflows/gitr-api-qualification.yml'
  pull_request:
    paths:
      - 'rust/gitr/**'
      - 'rust/gitr-action-example/**'
      - 'ci/gitr-api-smoke.py'
      - 'ci/gitr-redb-policy.py'
      - '.github/workflows/gitr-api-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitr-redb-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - name: Bootstrap pinned Lustr
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          printf '%s/.gitr-ci/lustr/bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Formatting and API-enabled Rust tests
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr/Cargo.toml -- --check
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --features action-api --all-targets
      - name: Strict API diagnostics
        if: runner.os == 'Linux'
        run: lustr --engine rustc clippy --manifest-path rust/gitr/Cargo.toml --locked --features action-api --all-targets -- -D warnings
      - name: Native CLI, HTTP, Rust Wasm, concurrency and crash recovery
        run: |
          lustr --engine rustc build --manifest-path rust/gitr/Cargo.toml --locked --features action-api
          lustr --engine rustc build --manifest-path rust/gitr-action-example/Cargo.toml --locked --release --target wasm32-unknown-unknown
          python ci/gitr-api-smoke.py
      - name: Backend policy and default CLI regression tests
        run: |
          python ci/gitr-redb-policy.py --self-test
          python ci/gitr-redb-policy.py
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --no-default-features --all-targets
