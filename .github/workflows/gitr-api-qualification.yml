name: gitr redb action API candidate
on:
  push:
    branches: [master]
    paths:
      - 'rust/gitr/src/actions_api.rs'
      - 'ci/gitr-api-*.py'
      - '.github/workflows/gitr-api-qualification.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gitr-redb-api-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'glopyglerky/gitr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glopyglerky/lustr
          ref: 62494e27717a64c8612b538409de27048fa6adc2
          path: .gitr-ci/lustr-src
          persist-credentials: false
      - name: Bootstrap pinned Lustr and optional API
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo install --path .gitr-ci/lustr-src/tools/cargo-lust --root .gitr-ci/lustr --locked --offline
          echo "$GITHUB_WORKSPACE/.gitr-ci/lustr/bin" >> "$GITHUB_PATH"
          python3 ci/gitr-api-prepare.py
      - name: Qualify shared redb action service through Lustr
        run: |
          lustr --engine rustc fmt --manifest-path rust/gitr/Cargo.toml
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --features action-api --all-targets
          lustr --engine rustc clippy --manifest-path rust/gitr/Cargo.toml --locked --features action-api --all-targets -- -D warnings
          lustr --engine rustc build --manifest-path rust/gitr/Cargo.toml --locked --features action-api
          lustr --engine rustc build --manifest-path rust/gitr-action-example/Cargo.toml --locked --release --target wasm32-unknown-unknown
          python3 ci/gitr-api-smoke.py
          python3 ci/gitr-redb-policy.py --self-test
          python3 ci/gitr-redb-policy.py
          lustr --engine rustc test --manifest-path rust/gitr/Cargo.toml --locked --no-default-features --all-targets
      - name: Retain exact tested integration blobs for reviewed activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          print('TESTED_BASE_COMMIT=' + os.environ['GITHUB_SHA'])
          for path in ['rust/gitr/Cargo.toml','rust/gitr/Cargo.lock','rust/gitr/src/actions.rs','rust/gitr/src/actions_api.rs','rust/gitr/src/actions_export.rs']:
              data = Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/glopyglerky/gitr/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              print('TESTED_BLOB=' + json.dumps({'path':path,'sha':blob['sha'],'sha256':hashlib.sha256(data).hexdigest()}))
          PY
# No branch or commit writes. Remove the preparation step and write permission
# when the exact passing implementation is activated on master.
