[package]
name = "rit"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE"
description = "Native Rust Git implementation assembled from upstream engines"
repository = "https://github.com/glopyglerky/rit"
publish = false
default-run = "rit"

[workspace]
# The pinned external Git oracle has its own standalone Rust support crate.
exclude = ["vendor/sley", "vendor/grit", "vendor/rbit-workflow", "xtask", "crates/action-example", "crates/test-support", "Documentation/gitr/archive", ".rit-ci/reference-git-source", ".gitr-ci/reference-git-source"]

[features]
default = []
parity-tools = ["sley-cli/testkit"]

[dependencies]
sley-cli = { path = "vendor/sley/crates/sley-cli" }
sley = { path = "vendor/sley/crates/sley", default-features = false }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3.27"

[[bin]]
name = "rit"
path = "src/main.rs"

[[bin]]
name = "git"
path = "src/bin/git.rs"

[[bin]]
name = "scalar"
path = "src/bin/scalar.rs"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
