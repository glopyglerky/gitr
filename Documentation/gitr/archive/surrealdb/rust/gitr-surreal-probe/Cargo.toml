[package]
name = "gitr-surreal-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Isolated SurrealDB 4 / SurrealKV qualification, not the production Gitr backend"

[workspace]

[dependencies]
anyhow = "1.0"
surrealdb = { version = "=4.0.0", default-features = false, features = ["kv-surrealkv"] }
# Match the selected database release; do not mistake stable-format 1.0 for its dependency pin.
surrealkv = "=1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false
