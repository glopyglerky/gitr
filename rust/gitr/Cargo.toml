[package]
name = "gitr"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-2.0-only"
description = "Rust Git tooling with verified large-file storage and GitHub-compatible protocols"
repository = "https://github.com/glopyglerky/gitr"
publish = false

# Keep the Rust port separate from upstream Git's C-linked gitcore crate.
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fastcdc = "=5.0.0"
gix = { version = "=0.90.0", default-features = false, features = ["max-performance", "revision", "status", "sha1", "sha256"] }
ignore = "0.4"
redb = "=4.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
url = "2.5"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
