[package]
name = "gitr-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Opt-in single-owner SurrealDB action storage service for Gitr"

# Separate executable: no dependency on GPL Git or the Gitr crate.
[workspace]

[dependencies]
anyhow = "1.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
surrealdb = { version = "=4.0.0", default-features = false, features = ["kv-surrealkv"] }
surrealkv = "=1.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
url = "2.5"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false
